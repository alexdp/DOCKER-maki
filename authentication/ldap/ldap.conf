#
# /etc/ldap/ldap.conf
# Configuration client LDAP (utilisée par ldapsearch, ldapadd, pam_ldap, etc.)
#

URI ldap://localhost
BASE dc=domain,dc=lan

# --- Identifiant de liaison par défaut (pour les commandes authentifiées) ---
BINDDN cn=admin,dc=domain,dc=lan
BINDPW admin

# --- Options SSL/TLS ---
# Pour un LDAP local sans chiffrement :
SSL no
TLS_CACERTDIR /etc/ssl/certs
TLS_REQCERT allow

# --- Comportement par défaut ---
SASL_MECH simple
REFERRALS off
TIMEOUT 15
NETWORK_TIMEOUT 15
