[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   min protocol = SMB2_10
   max protocol = SMB3
   server min protocol = SMB2_10
   use sendfile = yes
   # Découverte rapide pour Windows
   name resolve order = host bcast
   # Pas de signature obligatoire = vitesses max
   server signing = auto
   smb encrypt = off
   map to guest = Bad User
   guest account = nobody


[public]
   comment = Public Share - Linux Users Only
   path = /mnt
   browsable = yes
   writable = yes
   guest ok = no
   read only = no
   create mask = 0666
   directory mask = 0777
