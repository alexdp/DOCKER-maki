set default=0
set timeout=3
set gfxmode=auto
insmod gfxterm
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Configurer le clavier français dans GRUB
insmod keylayouts
keymap fr

# toram automatic-ubiquity
menuentry "Homemade NAS based on Ubuntu" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper noprompt keyboard-configuration/layoutcode=fr net.ifnames=0 biosdevname=0 tmpfs_size=4G ---
    initrd /casper/initrd
}

menuentry "Shell Debug" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper debug break=init keyboard-configuration/layoutcode=fr net.ifnames=0 biosdevname=0 tmpfs_size=4G ---
    initrd /casper/initrd
}
